name: Deploy WordPress Plugin to SVN

on:
  workflow_dispatch:
  push:
    tags:
      - '*'

jobs:
  svn-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout GitHub repository
        uses: actions/checkout@v4

      - name: Install SVN
        run: sudo apt-get update && sudo apt-get install -y subversion rsync

      - name: Deploy to WordPress.org SVN
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
        run: |
          VERSION="1.8.1"

          svn checkout \
            https://plugins.svn.wordpress.org/productshift-backup-migration \
            /tmp/wp-svn \
            --username "$SVN_USERNAME" \
            --password "$SVN_PASSWORD" \
            --non-interactive

          mkdir -p /tmp/wp-svn/trunk
          mkdir -p /tmp/wp-svn/tags/$VERSION

          rsync -av --delete \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'wp-svn' \
            ./ /tmp/wp-svn/trunk/

          rsync -av --delete \
            /tmp/wp-svn/trunk/ \
            /tmp/wp-svn/tags/$VERSION/

          cd /tmp/wp-svn

          svn add --force trunk tags/$VERSION \
            --username "$SVN_USERNAME" \
            --password "$SVN_PASSWORD" \
            --non-interactive || true

          svn status | grep '^!' | awk '{print $2}' | xargs -r svn delete

          svn commit \
            -m "Release ProductShift 1.8.1" \
            --username "$SVN_USERNAME" \
            --password "$SVN_PASSWORD" \
            --non-interactive
